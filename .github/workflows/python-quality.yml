name: Python quality checks

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**", "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight API test dependencies
        run: python -m pip install Flask Flask-Cors

      - name: Compile backend Python files
        run: python -m compileall -q chatbot-rag/backend

      - name: Run unit and Flask route tests
        run: python -m unittest discover -s tests -v
